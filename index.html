<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>계란 복수전: 랭킹 시스템</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #f0f8ff; margin-bottom: 50px; }
        #game-container { max-width: 800px; margin: 0 auto; }
        .student-area { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
        .student { width: 100px; height: 120px; background: #fff; border: 2px solid #333; border-radius: 10px; 
                   cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; 
                   transition: transform 0.1s; position: relative; }
        .student.active { background: #ffeb3b; transform: scale(1.1); }
        .egg { position: absolute; font-size: 24px; top: -20px; animation: throw 0.5s forwards; }
        @keyframes throw { from { top: 0; opacity: 1; } to { top: -100px; opacity: 0; } }
        #status { font-size: 1.2rem; margin: 20px; font-weight: bold; color: #d32f2f; height: 30px; }
        #score-board { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* 랭킹 스타일 */
        #ranking-section { margin-top: 40px; padding: 20px; background: #fff; border-radius: 10px; display: inline-block; min-width: 300px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>🥚 계란 복수전 (랭킹 모드)</h1>
        <p>20명의 학생을 가장 빨리 잡는 선생님은 누구일까요?</p>
        
        <div id="score-board">
            <div id="status">준비...</div>
            <div id="info">성공: 0/20 | 대기 중인 계란: 0</div>
            <div id="timer">시간: 0.00초</div>
        </div>
        
        <div class="student-area" id="student-grid"></div>

        <div id="ranking-section">
            <h3>🏆 전설의 선생님 랭킹 (TOP 5)</h3>
            <table id="rank-table">
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>이름</th>
                        <th>기록</th>
                    </tr>
                </thead>
                <tbody id="rank-body"></tbody>
            </table>
            <button onclick="clearRanking()" style="margin-top:10px; cursor:pointer;">랭킹 초기화</button>
        </div>
    </div>

    <script>
        // --- 연결 리스트 (기존 로직 유지) ---
        class Node { constructor(data) { this.data = data; this.next = null; } }
        class LinkedList {
            constructor() { this.head = null; this.tail = null; this.length = 0; }
            enqueue(id) {
                const newNode = new Node(id);
                if (!this.head) { this.head = newNode; this.tail = newNode; }
                else { this.tail.next = newNode; this.tail = newNode; }
                this.length++;
            }
            dequeue() {
                if (!this.head) return null;
                const data = this.head.data;
                this.head = this.head.next;
                this.length--;
                return data;
            }
            peek() { return this.head ? this.head.data : null; }
        }

        const list = new LinkedList();
        const studentGrid = document.getElementById('student-grid');
        const statusDisplay = document.getElementById('status');
        const infoDisplay = document.getElementById('info');
        const timerDisplay = document.getElementById('timer');
        
        let successCount = 0;
        let startTime;
        let timerInterval;
        let isGameOver = false;

        // 학생 배치
        for (let i = 1; i <= 10; i++) {
            const div = document.createElement('div');
            div.className = 'student';
            div.id = `student-${i}`;
            div.innerHTML = `👤<br>학생 ${i}`;
            div.onclick = () => checkAnswer(i);
            studentGrid.appendChild(div);
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timerDisplay.innerText = `시간: ${elapsed.toFixed(2)}초`;
            }, 50);
        }

        function studentThrowsEgg() {
            if (isGameOver || successCount >= 20) return;

            const randomStudentId = Math.floor(Math.random() * 10) + 1;
            list.enqueue(randomStudentId);
            
            const studentEl = document.getElementById(`student-${randomStudentId}`);
            studentEl.classList.add('active');
            const egg = document.createElement('span');
            egg.className = 'egg';
            egg.innerText = '🥚';
            studentEl.appendChild(egg);

            setTimeout(() => {
                studentEl.classList.remove('active');
                egg.remove();
            }, 600);

            updateUI();
            setTimeout(studentThrowsEgg, Math.max(1000 - (successCount * 45), 350));
        }

        function checkAnswer(studentId) {
            if (isGameOver) return;
            const targetId = list.peek();
            
            if (targetId === null) return;

            if (studentId === targetId) {
                list.dequeue();
                successCount++;
                statusDisplay.innerText = "🎯 맞혔습니다!";
                statusDisplay.style.color = "blue";
                
                if (successCount === 20) endGame();
            } else {
                statusDisplay.innerText = "❌ 순서가 틀렸어요!";
                statusDisplay.style.color = "red";
            }
            updateUI();
        }

        function updateUI() {
            infoDisplay.innerText = `성공: ${successCount}/20 | 대기 중인 계란: ${list.length}`;
        }

        function endGame() {
            isGameOver = true;
            clearInterval(timerInterval);
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            statusDisplay.innerText = "🎉 미션 완료!";
            
            setTimeout(() => {
                const userName = prompt(`축하합니다! 20명을 모두 잡았습니다!\n기록: ${finalTime}초\n이름을 입력하세요:`);
                if (userName) saveRank(userName, finalTime);
            }, 100);
        }

        // --- 랭킹 로직 (Local Storage) ---
        function saveRank(name, time) {
            let ranks = JSON.parse(localStorage.getItem('eggGameRanks')) || [];
            ranks.push({ name, time: parseFloat(time) });
            ranks.sort((a, b) => a.time - b.time); // 시간 짧은 순서
            ranks = ranks.slice(0, 5); // 5위까지만
            localStorage.setItem('eggGameRanks', JSON.stringify(ranks));
            displayRanks();
        }

        function displayRanks() {
            const ranks = JSON.parse(localStorage.getItem('eggGameRanks')) || [];
            const tbody = document.getElementById('rank-body');
            tbody.innerHTML = ranks.map((r, i) => 
                `<tr><td>${i+1}위</td><td>${r.name}</td><td>${r.time}초</td></tr>`
            ).join('');
        }

        function clearRanking() {
            if(confirm("랭킹을 초기화할까요?")) {
                localStorage.removeItem('eggGameRanks');
                displayRanks();
            }
        }

        // 초기 실행
        displayRanks();
        startTimer();
        setTimeout(studentThrowsEgg, 1000);

    </script>
</body>
</html>
